; PlatformIO-Projekt-Konfiguration für trt.1DArcadeShooter
; Alternative zu Arduino IDE

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Serielle Monitor-Einstellungen
monitor_speed = 115200

; Upload-Geschwindigkeit
upload_speed = 115200

; Benötigte Bibliotheken
lib_deps = 
    fastled/FastLED@^3.7.0
    esphome/ESPAsyncWebServer-esphome@^2.0.0
    bblanchon/ArduinoJson@^7.0.0

; Build-Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=16
    -D CONFIG_ASYNC_TCP_MAX_CLIENTS=4

; Board-Konfiguration
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB

; Partitionierung (optional, für größere Projekte)
; board_build.partitions = min_spiffs.csv